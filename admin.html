
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin NolevKomik</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
    max-width:700px;
    margin:auto;
    padding:20px;
}

input,textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    background:#1e88e5;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>Admin NolevKomik</h1>

<input id="judul" placeholder="Judul Komik">
<input id="cover" placeholder="gambar/cover.jpg">
<input id="genre" placeholder="Genre">
<input id="status" placeholder="Status">
<textarea id="deskripsi" placeholder="Deskripsi"></textarea>

<button id="btnTambah">Tambah Komik</button>

<script>
window.onerror = function(msg, url, line) {
    alert(msg + " (baris " + line + ")");
};
</script>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/admin.js"></script>

</body>
</html>
