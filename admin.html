<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin NolevKomik</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    background: #0b1120;
    color: #f8fafc;

    font-family: 'Plus Jakarta Sans', sans-serif;

    max-width: 760px;
    margin: auto;

    padding: 20px 15px 40px;
}

/* =========================
   HEADER
========================= */

.admin-header {
    text-align: center;
    padding: 15px 10px 25px;
}

.admin-header h1 {
    margin: 0;

    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 700;

    background: linear-gradient(
        135deg,
        #a78bfa,
        #f472b6
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.admin-header p {
    margin: 7px 0 0;

    color: #94a3b8;
    font-size: 13px;
}

/* =========================
   CARD
========================= */

.admin-card {
    background: #111827;

    border: 1px solid #1e293b;
    border-radius: 16px;

    padding: 18px;

    margin-bottom: 16px;
}

.admin-card h2 {
    margin: 0 0 16px;

    font-family: 'Space Grotesk', sans-serif;
    font-size: 19px;
    font-weight: 700;
}

/* =========================
   FORM
========================= */

input,
textarea,
select {
    width: 100%;

    padding: 13px 14px;

    margin: 0 0 11px;

    background: #0b1120;

    color: #f8fafc;

    border: 1px solid #334155;
    border-radius: 10px;

    outline: none;

    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #8b5cf6;

    box-shadow:
        0 0 0 2px rgba(139, 92, 246, 0.15);
}

textarea {
    min-height: 110px;
    resize: vertical;
}

input[type="file"] {
    padding: 10px;
    color: #cbd5e1;
}

/* =========================
   BUTTON
========================= */

button {
    width: 100%;

    padding: 13px 15px;

    margin-top: 2px;

    background: linear-gradient(
        135deg,
        #7c3aed,
        #ec4899
    );

    color: white;

    border: none;
    border-radius: 10px;

    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px;
    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        opacity 0.15s ease;
}

button:hover {
    opacity: 0.92;
}

button:active {
    transform: scale(0.98);
}

/* =========================
   DELETE BUTTON
========================= */

#btnHapusChapter,
#btnHapusKomik {
    background: #dc2626 !important;
}

#btnHapusChapter:hover,
#btnHapusKomik:hover {
    background: #b91c1c !important;
}

/* =========================
   PAGE LIST
========================= */

#pageList {
    margin: 5px 0 10px;
}

#pageList > div {
    background: #0b1120;

    border: 1px solid #1e293b;

    border-radius: 8px;

    padding: 9px 11px;

    margin-bottom: 6px;

    color: #cbd5e1;

    font-size: 13px;
}

#pageCount {
    margin: 5px 0 12px;

    color: #94a3b8;

    font-size: 13px;
}

/* =========================
   PEMISAH
========================= */

hr {
    display: none;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {
        padding:
            12px
            12px
            30px;
    }

    .admin-header {
        padding-top: 10px;
        padding-bottom: 20px;
    }

    .admin-header h1 {
        font-size: 25px;
    }

    .admin-card {
        padding: 15px;
        border-radius: 14px;
    }

    .admin-card h2 {
        font-size: 18px;
    }

}

</style>
</head>

<body>

<header class="admin-header">

    <h1>Admin NolevKomik</h1>

    <p>
        Kelola komik pribadi kamu
    </p>

</header>


<!-- =========================
     TAMBAH KOMIK
========================= -->

<section class="admin-card">

    <h2>📚 Tambah Komik</h2>

    <input
        id="judul"
        placeholder="Judul Komik"
    >

    <input
        type="file"
        id="cover"
        accept="image/*"
    >

    <input
        id="genre"
        placeholder="Genre"
    >

    <input
        id="status"
        placeholder="Status"
    >

    <textarea
        id="deskripsi"
        placeholder="Deskripsi"
    ></textarea>

    <button id="btnTambah">
        Tambah Komik
    </button>

</section>


<!-- =========================
     TAMBAH CHAPTER
========================= -->

<section class="admin-card">

    <h2>📖 Tambah Chapter</h2>

    <select id="chapterComic">

        <option value="">
            Pilih Komik
        </option>

    </select>

    <input
        type="number"
        id="chapterNumber"
        placeholder="Nomor Chapter"
        min="1"
    >

    <input
        type="file"
        id="chapterImage"
        accept="image/*"
    >

    <button
        type="button"
        id="btnTambahHalaman"
    >
        + Tambah Halaman
    </button>

    <div id="pageList"></div>

    <p id="pageCount">
        Belum ada halaman.
    </p>

    <button id="btnTambahChapter">
        Simpan Chapter
    </button>

</section>


<!-- =========================
     KELOLA CHAPTER
========================= -->

<section class="admin-card">

    <h2>🗂️ Kelola Chapter</h2>

    <select id="deleteChapterComic">

        <option value="">
            Pilih Komik
        </option>

    </select>

    <select id="deleteChapterSelect">

        <option value="">
            Pilih Chapter
        </option>

    </select>

    <button
        type="button"
        id="btnHapusChapter"
    >
        🗑️ Hapus Chapter
    </button>

</section>


<!-- =========================
     KELOLA KOMIK
========================= -->

<section class="admin-card">

    <h2>🗑️ Kelola Komik</h2>

    <select id="deleteComicSelect">

        <option value="">
            Pilih Komik
        </option>

    </select>

    <button
        type="button"
        id="btnHapusKomik"
    >
        🗑️ Hapus Komik
    </button>

</section>


<!-- =========================
     EDIT KOMIK
========================= -->

<section class="admin-card">

    <h2>✏️ Edit Komik</h2>

    <select id="editComicSelect">

        <option value="">
            Pilih Komik
        </option>

    </select>

    <input
        type="text"
        id="editJudul"
        placeholder="Judul Komik"
    >

    <input
        type="file"
        id="editCover"
        accept="image/*"
    >

    <input
        type="text"
        id="editGenre"
        placeholder="Genre"
    >

    <input
        type="text"
        id="editStatus"
        placeholder="Status"
    >

    <textarea
        id="editDeskripsi"
        placeholder="Deskripsi"
    ></textarea>

    <button
        type="button"
        id="btnEditKomik"
    >
        💾 Simpan Perubahan
    </button>

</section>


<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script src="assets/js/admin.js"></script>

</body>
</html>
