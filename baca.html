<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baca Chapter</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #1e88e5;
    padding: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    position: sticky;
    top: 0;
    z-index: 10;
}

#pages {
    max-width: 900px;
    margin: auto;
}

.page {
    display: block;
    width: 100%;
    height: auto;
}

.loading {
    text-align: center;
    padding: 40px 20px;
    font-size: 20px;
}

.error {
    margin: 20px;
    padding: 20px;
    background: #222;
    border-radius: 10px;
}

.bottom {
    padding: 25px;
    text-align: center;
}

.bottom a {
    display: inline-block;
    padding: 12px 20px;
    background: #1e88e5;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}
</style>
</head>

<body>

<header id="chapterTitle">
    Memuat chapter...
</header>

<div id="loading" class="loading">
    Memuat halaman...
</div>

<div id="error" class="error" style="display:none;"></div>

<div id="pages"></div>

<div class="bottom">
    <a id="backButton" href="index.html">
        ⬅️ Kembali
    </a>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ejomjasqzlzcwzevqwjs.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Sg46KKG4LgPAginx9MLJkQ_ht3fw0Ua";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const chapterId =
    new URLSearchParams(window.location.search).get("id");


async function loadChapter() {

    const loading =
        document.getElementById("loading");

    const errorBox =
        document.getElementById("error");

    const pages =
        document.getElementById("pages");


    if (!chapterId) {

        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
            "ID chapter tidak ditemukan.";

        return;
    }


    const { data, error } = await db
        .from("chapters")
        .select("id, comic_id, chapter_number, content")
        .eq("id", chapterId)
        .single();


    if (error) {

        console.error(error);

        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
            "Gagal memuat chapter: " +
            error.message;

        return;
    }


    document.getElementById("chapterTitle").textContent =
        "Chapter " + data.chapter_number;


    document.getElementById("backButton").href =
        "detail.html?id=" + data.comic_id;


    let imageUrls = [];

    try {

        imageUrls = JSON.parse(data.content);

    } catch (e) {

        imageUrls = [];

    }


    if (!Array.isArray(imageUrls) || imageUrls.length === 0) {

        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
            "Chapter ini belum memiliki halaman gambar.";

        return;
    }


    pages.innerHTML = "";


    imageUrls.forEach((url, index) => {

        const img =
            document.createElement("img");

        img.className = "page";

        img.src = url;

        img.alt =
            "Chapter " +
            data.chapter_number +
            " - Halaman " +
            (index + 1);

        pages.appendChild(img);

    });


    loading.style.display = "none";
}


loadChapter();

</script>

</body>
</html>
