<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baca Chapter</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #0b1120;
    color: #fff;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

/* HEADER */

header {
    position: relative;

    background: rgba(15, 23, 42, 0.96);
    border-bottom: 1px solid #1e293b;

    padding: 14px 16px;

    text-align: center;

    font-family: 'Space Grotesk', sans-serif;
    font-size: 19px;
    font-weight: 700;
}

/* AREA HALAMAN KOMIK */

#pages {
    width: 100%;
    max-width: 900px;

    margin: 0 auto;

    background: #000;
}

/* GAMBAR KOMIK */

.page {
    display: block;

    width: 100%;
    height: auto;

    margin: 0;
    padding: 0;

    border: 0;
}

/* LOADING */

.loading {
    text-align: center;

    padding: 50px 20px;

    color: #94a3b8;

    font-size: 14px;
}

/* ERROR */

.error {
    margin: 25px 15px;
    padding: 18px;

    background: #111827;

    border: 1px solid #334155;
    border-radius: 12px;

    color: #cbd5e1;

    text-align: center;
}

/* BAGIAN BAWAH */

.bottom {
    padding: 25px 15px 35px;

    text-align: center;
}

.bottom a {
    display: inline-block;

    padding: 10px 16px;

    background: #1e293b;

    border: 1px solid #334155;

    color: #fff;

    text-decoration: none;

    border-radius: 9px;

    font-size: 13px;
    font-weight: 600;

    transition: 0.2s ease;
}

.bottom a:hover {
    background: linear-gradient(
        135deg,
        #7c3aed,
        #ec4899
    );

    border-color: transparent;
}

/* MOBILE */

@media (max-width: 600px) {

    header {
        padding: 13px 12px;
        font-size: 17px;
    }

    #pages {
        width: 100%;
    }

    .bottom {
        padding-top: 20px;
    }

}

</style>
</head>

<body>

<header id="chapterTitle">
    Memuat chapter...
</header>

<div id="loading" class="loading">
    Memuat halaman...
</div>

<div id="error" class="error" style="display:none;"></div>

<div id="pages"></div>

<div class="bottom">
    <a id="backButton" href="index.html">
        ← Kembali
    </a>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ejomjasqzlzcwzevqwjs.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Sg46KKG4LgPAginx9MLJkQ_ht3fw0Ua";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const chapterId =
    new URLSearchParams(window.location.search).get("id");


async function loadChapter() {

    const loading =
        document.getElementById("loading");

    const errorBox =
        document.getElementById("error");

    const pages =
        document.getElementById("pages");


    if (!chapterId) {

        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
            "ID chapter tidak ditemukan.";

        return;
    }


    const { data, error } = await db
        .from("chapters")
        .select("id, comic_id, chapter_number, content")
        .eq("id", chapterId)
        .single();


    if (error) {

        console.error(error);

        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
            "Gagal memuat chapter: " +
            error.message;

        return;
    }


    document.getElementById("chapterTitle").textContent =
        "Chapter " + data.chapter_number;


    document.getElementById("backButton").href =
        "detail.html?id=" + data.comic_id;


    let imageUrls = [];

    try {

        imageUrls = JSON.parse(data.content);

    } catch (e) {

        imageUrls = [];

    }


    if (!Array.isArray(imageUrls) || imageUrls.length === 0) {

        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
            "Chapter ini belum memiliki halaman gambar.";

        return;
    }


    pages.innerHTML = "";


    imageUrls.forEach((url, index) => {

        const img =
            document.createElement("img");

        img.className = "page";

        img.src = url;

        img.alt =
            "Chapter " +
            data.chapter_number +
            " - Halaman " +
            (index + 1);

        pages.appendChild(img);

    });


    loading.style.display = "none";
}


loadChapter();

</script>

</body>
</html>
