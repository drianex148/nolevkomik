<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baca Chapter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
    background: #0b1120;
    color: #fff;
    min-height: 100vh;
}

/* HEADER */
header {
    position: sticky;
    top: 0;
    z-index: 100;

    background: rgba(15, 23, 42, .95);
    backdrop-filter: blur(10px);

    border-bottom: 1px solid #1e293b;

    padding: 14px 16px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

/* JUDUL */
header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* TOMBOL KEMBALI */
.back {
    color: #fff;
    text-decoration: none;

    background: #1e293b;

    padding: 8px 12px;
    border-radius: 8px;

    font-size: 13px;
    font-weight: 600;

    white-space: nowrap;

    transition: .2s ease;
}

.back:hover {
    background: linear-gradient(
        135deg,
        #7c3aed,
        #ec4899
    );
}

/* AREA BACA */
#reader {
    width: 100%;
    max-width: 900px;

    margin: auto;

    display: flex;
    flex-direction: column;
    align-items: center;
}

/* GAMBAR HALAMAN */
#reader img {
    display: block;

    width: auto;
    max-width: 900px;
    height: auto;

    margin: 0 auto;

    background: #111827;
}

/* LOADING */
.loading {
    color: #94a3b8;
    text-align: center;

    padding: 60px 20px;

    font-size: 14px;
}

/* ERROR */
.error {
    margin: 30px 15px;

    padding: 18px;

    background: #111827;

    border: 1px solid #334155;

    border-radius: 12px;

    color: #cbd5e1;

    text-align: center;
}

/* MOBILE */
@media (max-width: 600px) {

    header {
        padding: 12px;
    }

    header h1 {
        font-size: 16px;
    }

    .back {
        padding: 7px 10px;
        font-size: 12px;
    }

    #reader img {
        width: 100%;
    }
}
</style>
</head>

<body>

<header id="chapterTitle">
    Memuat chapter...
</header>

<div id="loading" class="loading">
    Memuat halaman...
</div>

<div id="error" class="error" style="display:none;"></div>

<div id="pages"></div>

<div class="bottom">
    <a id="backButton" href="index.html">
        ⬅️ Kembali
    </a>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ejomjasqzlzcwzevqwjs.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Sg46KKG4LgPAginx9MLJkQ_ht3fw0Ua";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const chapterId =
    new URLSearchParams(window.location.search).get("id");


async function loadChapter() {

    const loading =
        document.getElementById("loading");

    const errorBox =
        document.getElementById("error");

    const pages =
        document.getElementById("pages");


    if (!chapterId) {

        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
            "ID chapter tidak ditemukan.";

        return;
    }


    const { data, error } = await db
        .from("chapters")
        .select("id, comic_id, chapter_number, content")
        .eq("id", chapterId)
        .single();


    if (error) {

        console.error(error);

        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
            "Gagal memuat chapter: " +
            error.message;

        return;
    }


    document.getElementById("chapterTitle").textContent =
        "Chapter " + data.chapter_number;


    document.getElementById("backButton").href =
        "detail.html?id=" + data.comic_id;


    let imageUrls = [];

    try {

        imageUrls = JSON.parse(data.content);

    } catch (e) {

        imageUrls = [];

    }


    if (!Array.isArray(imageUrls) || imageUrls.length === 0) {

        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
            "Chapter ini belum memiliki halaman gambar.";

        return;
    }


    pages.innerHTML = "";


    imageUrls.forEach((url, index) => {

        const img =
            document.createElement("img");

        img.className = "page";

        img.src = url;

        img.alt =
            "Chapter " +
            data.chapter_number +
            " - Halaman " +
            (index + 1);

        pages.appendChild(img);

    });


    loading.style.display = "none";
}


loadChapter();

</script>

</body>
</html>
