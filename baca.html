<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baca Chapter</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1e88e5;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    position:sticky;
    top:0;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.content{
    white-space:pre-wrap;
    background:#222;
    padding:20px;
    border-radius:10px;
    font-size:18px;
    line-height:1.7;
}

.loading{
    text-align:center;
    padding:40px 0;
    font-size:20px;
}

.error{
    background:#222;
    padding:20px;
    border-radius:10px;
}

.nav{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.nav a{
    flex:1;
    background:#1e88e5;
    color:white;
    padding:14px;
    text-align:center;
    text-decoration:none;
    border-radius:8px;
}
</style>

</head>

<body>

<header id="header">
    Memuat chapter...
</header>

<div class="container">

    <div id="loading" class="loading">
        Memuat chapter...
    </div>

    <div id="error" class="error" style="display:none;"></div>

    <div id="content" class="content" style="display:none;"></div>

    <div class="nav">
        <a id="back" href="index.html">
            ⬅️ Kembali
        </a>

        <a href="index.html">
            🏠 Beranda
        </a>
    </div>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ejomjasqzlzcwzevqwjs.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Sg46KKG4LgPAginx9MLJkQ_ht3fw0Ua";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const id =
    new URLSearchParams(window.location.search).get("id");


async function loadChapter(){

    const loading =
        document.getElementById("loading");

    const errorBox =
        document.getElementById("error");

    const content =
        document.getElementById("content");


    if(!id){

        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
            "ID chapter tidak ditemukan.";

        return;
    }


    const { data, error } = await db
        .from("chapters")
        .select(
            "id, comic_id, chapter_number, content_text"
        )
        .eq("id", id)
        .single();


    if(error){

        console.error(error);

        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
            "Gagal memuat chapter: " +
            error.message;

        return;
    }


    document.getElementById("header").textContent =
        "Chapter " + data.chapter_number;


    content.textContent =
        data.content_text ||
        "Belum ada isi chapter.";


    document.getElementById("back").href =
        "detail.html?id=" + data.comic_id;


    loading.style.display = "none";

    content.style.display = "block";
}


loadChapter();

</script>

</body>
  </html>
