<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detail Komik</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1e88e5;
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.cover{
    width:220px;
    max-width:100%;
    border-radius:10px;
}

.info{
    margin-top:15px;
}

.chapter{
    display:block;
    background:#222;
    color:white;
    text-decoration:none;
    padding:15px;
    margin-top:10px;
    border-radius:8px;
}

.chapter:hover{
    background:#333;
}

.loading{
    text-align:center;
    font-size:20px;
    padding:40px 0;
}

.error{
    background:#222;
    padding:20px;
    border-radius:10px;
}
</style>

</head>

<body>

<header>NOLEVKOMIK</header>

<div class="container">

    <div id="loading" class="loading">
        Memuat komik...
    </div>

    <div id="content" style="display:none;">

        <img id="cover" class="cover" alt="Cover komik">

        <div class="info">

            <h2 id="title"></h2>

            <p>
                <b>Status:</b>
                <span id="status"></span>
            </p>

            <p>
                <b>Genre:</b>
                <span id="genre"></span>
            </p>

            <p id="description"></p>

            <h3>Daftar Chapter</h3>

            <a class="chapter" href="chapter1.html">
                Chapter 1
            </a>

            <a class="chapter" href="chapter2.html">
                Chapter 2
            </a>

        </div>

    </div>

    <div id="error" class="error" style="display:none;"></div>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ejomjasqzlzcwzevqwjs.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Sg46KKG4LgPAginx9MLJkQ_ht3fw0Ua";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// Ambil ID dari URL
const params = new URLSearchParams(window.location.search);
const comicId = params.get("id");


async function loadDetail(){

    if(!comicId){

        document.getElementById("loading").style.display = "none";

        const error = document.getElementById("error");

        error.style.display = "block";
        error.textContent = "ID komik tidak ditemukan.";

        return;
    }


    const { data, error } = await db
        .from("comics")
        .select("*")
        .eq("id", comicId)
        .single();


    if(error){

        console.error(error);

        document.getElementById("loading").style.display = "none";

        const errorBox = document.getElementById("error");

        errorBox.style.display = "block";
        errorBox.textContent =
            "Gagal memuat komik: " + error.message;

        return;
    }


    if(!data){

        document.getElementById("loading").style.display = "none";

        const errorBox = document.getElementById("error");

        errorBox.style.display = "block";
        errorBox.textContent = "Komik tidak ditemukan.";

        return;
    }


    // Tampilkan data komik
    document.getElementById("title").textContent =
        data.title || "Tanpa Judul";

    document.getElementById("status").textContent =
        data.status || "-";

    document.getElementById("genre").textContent =
        data.genre || "-";

    document.getElementById("description").textContent =
        data.description || "Belum ada deskripsi.";


    if(data.cover){

        document.getElementById("cover").src =
            data.cover;

        document.getElementById("cover").alt =
            data.title || "Cover komik";

    }else{

        document.getElementById("cover").style.display =
            "none";

    }


    document.getElementById("loading").style.display =
        "none";

    document.getElementById("content").style.display =
        "block";

}


loadDetail();

</script>

</body>
</html>
