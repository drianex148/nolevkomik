<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detail Komik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
    background: #0b1120;
    color: #fff;
    min-height: 100vh;
}

/* HEADER */
header {
    background: #0f172a;
    padding: 16px 20px;
    border-bottom: 1px solid #1e293b;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .5px;
}

/* CONTAINER */
.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 20px;
}

/* COVER */
.cover {
    width: 220px;
    max-width: 100%;

    display: block;
    margin: 0 auto 22px;

    border-radius: 14px;

    border: 1px solid #263247;

    box-shadow:
        0 15px 35px rgba(0,0,0,.35);
}

/* INFO */
.info {
    margin-top: 10px;
}

.info h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    margin-bottom: 15px;
}

.info p {
    color: #94a3b8;
    line-height: 1.7;
    margin-bottom: 8px;
}

.info p b {
    color: #fff;
}

#description {
    margin-top: 18px;
    padding: 15px;

    background: #111827;
    border: 1px solid #1e293b;

    border-radius: 12px;

    color: #cbd5e1;
}

/* CHAPTER TITLE */
.info h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;

    margin-top: 28px;
    margin-bottom: 12px;
}

/* CHAPTER */
.chapter {
    display: block;

    background: #111827;
    color: #fff;

    text-decoration: none;

    padding: 14px 16px;
    margin-top: 9px;

    border-radius: 10px;

    border: 1px solid #1e293b;

    font-size: 15px;
    font-weight: 600;

    transition:
        .2s ease;
}

.chapter:hover {
    background: linear-gradient(
        135deg,
        #7c3aed,
        #ec4899
    );

    border-color: transparent;

    transform: translateX(3px);
}

/* LOADING */
.loading {
    text-align: center;

    font-size: 15px;

    color: #94a3b8;

    padding: 50px 0;
}

/* ERROR */
.error {
    background: #111827;

    border: 1px solid #3b4558;

    padding: 18px;

    border-radius: 12px;

    color: #cbd5e1;
}

/* MOBILE */
@media (max-width: 600px) {

    header {
        padding: 14px 12px;
        font-size: 19px;
    }

    .container {
        padding: 20px 14px;
    }

    .cover {
        width: 190px;
        margin-bottom: 20px;
    }

    .info h2 {
        font-size: 23px;
    }

    .info h3 {
        font-size: 18px;
    }

    .chapter {
        padding: 13px 14px;
        font-size: 14px;
    }
}
</style>

</head>

<body>

<header>NOLEVKOMIK</header>

<div class="container">

    <div id="loading" class="loading">
        Memuat komik...
    </div>

    <div id="content" style="display:none;">

        <img id="cover" class="cover" alt="Cover komik">

        <div class="info">

            <h2 id="title"></h2>

            <p>
                <b>Status:</b>
                <span id="status"></span>
            </p>

            <p>
                <b>Genre:</b>
                <span id="genre"></span>
            </p>

            <p id="description"></p>

            <h3>Daftar Chapter</h3>

            <div id="chapterList">
                <div class="loading">
                    Memuat chapter...
                </div>
            </div>

        </div>

    </div>

    <div id="error" class="error" style="display:none;"></div>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ejomjasqzlzcwzevqwjs.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Sg46KKG4LgPAginx9MLJkQ_ht3fw0Ua";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// Ambil ID komik dari URL
const params = new URLSearchParams(window.location.search);
const comicId = params.get("id");


async function loadDetail(){

    if(!comicId){

        document.getElementById("loading").style.display = "none";

        const errorBox = document.getElementById("error");

        errorBox.style.display = "block";
        errorBox.textContent = "ID komik tidak ditemukan.";

        return;
    }


    // =========================
    // AMBIL DATA KOMIK
    // =========================

    const { data, error } = await db
        .from("comics")
        .select("*")
        .eq("id", comicId)
        .single();


    if(error){

        console.error(error);

        document.getElementById("loading").style.display = "none";

        const errorBox = document.getElementById("error");

        errorBox.style.display = "block";
        errorBox.textContent =
            "Gagal memuat komik: " + error.message;

        return;
    }


    if(!data){

        document.getElementById("loading").style.display = "none";

        const errorBox = document.getElementById("error");

        errorBox.style.display = "block";
        errorBox.textContent = "Komik tidak ditemukan.";

        return;
    }


    // =========================
    // TAMPILKAN DATA KOMIK
    // =========================

    document.getElementById("title").textContent =
        data.title || "Tanpa Judul";

    document.getElementById("status").textContent =
        data.status || "-";

    document.getElementById("genre").textContent =
        data.genre || "-";

    document.getElementById("description").textContent =
        data.description || "Belum ada deskripsi.";


    if(data.cover){

        document.getElementById("cover").src =
            data.cover;

        document.getElementById("cover").alt =
            data.title || "Cover komik";

    }else{

        document.getElementById("cover").style.display =
            "none";

    }


    // =========================
    // AMBIL CHAPTER KOMIK INI
    // =========================

    const { data: chapters, error: chapterError } = await db
        .from("chapters")
        .select("id, chapter_number")
        .eq("comic_id", comicId)
        .order("chapter_number", { ascending: true });


    const chapterList =
        document.getElementById("chapterList");


    if(chapterError){

        console.error(chapterError);

        chapterList.innerHTML =
    "<p>Gagal memuat chapter: " + chapterError.message + "</p>";

    }else if(!chapters || chapters.length === 0){

        chapterList.innerHTML =
            "<p>Belum ada chapter.</p>";

    }else{

        chapterList.innerHTML = "";

        chapters.forEach(chapter => {

            const link = document.createElement("a");

            link.className = "chapter";

            link.href =
                "baca.html?id=" + chapter.id;

            link.textContent =
                "Chapter " + chapter.chapter_number;

            chapterList.appendChild(link);

        });

    }


    // Tampilkan halaman
    document.getElementById("loading").style.display =
        "none";

    document.getElementById("content").style.display =
        "block";

}


loadDetail();

</script>

</body>
</html>
