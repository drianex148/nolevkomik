<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NolevKomik</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

header{
background:#1e88e5;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.search{
padding:15px;
}

.search input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
font-size:16px;
}

.container{
padding:15px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:15px;
}

.card{
background:#222;
border-radius:10px;
overflow:hidden;
transition:.2s;
}

.card:hover{
transform:scale(1.03);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card h3{
padding:10px;
font-size:18px;
}

.card p{
padding:0 10px 10px;
color:#aaa;
}

a{
text-decoration:none;
color:white;
}

footer{
padding:20px;
text-align:center;
color:#777;
}

</style>

</head>

<body>

<header>

📚 NOLEVKOMIK

</header>

<div class="search">

<input placeholder="Cari Komik...">

</div>

<div class="container">

<a href="komik.html">

<div class="card">

<img src="Oneee-san mode.jpg">

<h3>Komik Pertamaku</h3>

<p>Chapter 1</p>

</div>

</a>

</div>

<footer>

© 2026 NolevKomik

</footer>

</body>
</html>
